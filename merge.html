<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Brainrot Drop</title>
<style>
  /* Fredoka ONE (SIL OFL), bundled locally. Playables forbids external network
     calls, so a Google Fonts <link> would fail cert - a relative file inside
     our own bundle is fine, same as the character PNGs.
     Fredoka One is a SINGLE weight. The 400-900 range is declared deliberately
     so the browser maps every weight we ask for onto this one face instead of
     synthesising a faux-bold, which smears the outline. */
  @font-face{font-family:"Fredoka One";font-style:normal;font-weight:400 900;
    font-display:block;
    src:url(assets/font/fredokaone.woff2) format("woff2")}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;
    touch-action:none;font-family:"Fredoka One",Verdana,"Trebuchet MS",sans-serif;
    background:#bfe3f5}
  /* pastel checkerboard, the same read as the reference */
  /* Biome palette. Everything themeable is a custom property so a biome swap
     is one assignment plus a CSS transition, not a re-render. */
  :root{
    --sky:#ffd3e4; --skyTop:#ff9ec4; --skyBot:#fff2f7;
    --checker:rgba(255,255,255,.46);
    --floorA:#d8a86a; --floorB:#c08e50; --floorEdge:#a97840;
  }
  /* Checkers over a vertical GRADIENT, not a flat fill: one sky colour behind a
     repeating pattern reads as wallpaper. The gradient is listed last so it
     paints behind both checker layers. Checkers ~2x their old size - at 88px
     they were busy enough to compete with the board. */
  #bg{position:absolute;inset:0;
    background-color:var(--sky);
    background-image:linear-gradient(45deg,var(--checker) 25%,transparent 25%,transparent 75%,var(--checker) 75%),
                     linear-gradient(45deg,var(--checker) 25%,transparent 25%,transparent 75%,var(--checker) 75%),
                     linear-gradient(180deg,var(--skyTop) 0%,var(--sky) 52%,var(--skyBot) 100%);
    background-size:170px 170px,170px 170px,100% 100%;
    background-position:0 0,85px 85px,0 0;
    transition:background-color .5s}
  #floor{position:absolute;left:0;right:0;bottom:0;height:14%;/*JS overrides*/
    background:linear-gradient(var(--floorA),var(--floorB));
    border-top:5px solid var(--floorEdge);transition:background .5s,border-color .5s}
  /* ONE filter declaration: a second one would override the first outright,
     and the biome tint has to compose with the drop shadow, not replace it.
     The identity value is hue-rotate(0deg), because `none <shadow>` is invalid. */
  /* One cluster per side, sized in JS from the ground band. A single stretched
     full-width strip tied prop size to viewport width and ran the outer prop
     off the screen edge. contain + a matching box aspect means no distortion. */
  .props{position:absolute;background-repeat:no-repeat;background-size:contain;
    pointer-events:none}
  #propsL{background-position:bottom left}
  #propsR{background-position:bottom right}
  #box{position:absolute;display:block;pointer-events:none;opacity:0;
    transition:filter .5s}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block}

  #ui{position:absolute;inset:0;pointer-events:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  .rnd{width:58px;height:58px;pointer-events:auto}
  .rnd img{width:26px;height:26px;display:block;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
  .rnd svg{width:22px;height:22px;fill:#fff;filter:drop-shadow(0 1px 0 rgba(0,0,0,.4))}
  #tl{position:absolute;left:12px;top:12px;display:flex;gap:9px}

  #score{position:absolute;left:50%;top:10px;transform:translateX(-50%);
    font-size:56px;font-weight:700;color:#fff;letter-spacing:1px;
    -webkit-text-stroke:7px #5b7fa6;paint-order:stroke fill;
    text-shadow:0 4px 0 rgba(0,0,0,.16)}

  #tr{position:absolute;right:12px;top:10px;display:flex;flex-direction:column;
    align-items:center;gap:7px}
  /* a 9:32 viewport is only ~360px wide; the stack must not run off it */
  @media (max-width:400px){
    #tr{right:8px;gap:5px}
    #nextBox{width:64px;height:64px}
    #shake{min-width:96px;height:42px;font-size:13px}
    .pup{width:52px;height:44px;font-size:11px}
    #purse{top:64px;font-size:14px}
  }
  #nextBox{width:80px;height:80px;padding-bottom:0;
    border-width:9px 9px 14px 9px}
  /* size from the content box, never a fixed px, or the 9-slice clips it */
  #nextBox canvas{width:100%;height:100%;display:block}
  #nextLbl{font-size:13px;font-weight:700;color:#fff;-webkit-text-stroke:4px #5b7fa6;
    paint-order:stroke fill;letter-spacing:1px;margin-top:-4px}
  #shake{gap:5px;min-width:126px;height:56px;font-size:15px;letter-spacing:.5px;
    pointer-events:auto}
  #shake.off{filter:grayscale(.85);opacity:.55}
  #shake img{width:20px;height:20px;display:block;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}

  /* ---- 9-slice button frames (assets/ui) ----
     Sliced at the corner radius so the middle stretches. The bottom slice is
     deliberately larger than the top: these frames carry a 3D lip underneath
     (59px vs a 16px top border) and a symmetric slice would crush it. */
  .btn9{
    /* The face spans y 18..194 of the 255px art, so its centre sits at 41.6%,
       not 50%. Centring content in the element box therefore reads LOW - the
       extra bottom padding lifts it onto the face, off the 3D lip. */
    display:flex;align-items:center;justify-content:center;
    /* padding-TOP, where the old art needed padding-bottom. Measured: on these
       jelly frames the flat face is centred at ~60% of the height because the
       scalloped pleats eat the top third, so content has to sit BELOW the
       geometric centre. The old frames had their face at 41.6%, above it. */
    padding-top:8px;
    border-style:solid;
    /* New jelly art is ~473x267, where the old frames were 255px square, so the
       slices are re-derived rather than carried over: ~34% top to clear the
       scalloped pleats, ~25% sides for the rounded ends, ~29% bottom for the
       lip. Slicing shallower than the corner smears it when the button
       stretches. */
    border-width:18px 20px 16px 20px;
    border-image-slice:92 120 78 120 fill;
    border-image-repeat:stretch;
    background:none;
    box-shadow:none;
    color:#fff;font-weight:700;
    text-shadow:0 2px 0 rgba(0,0,0,.42);
    cursor:pointer;
    transition:transform .06s,filter .06s;
  }
  .btn9:active{transform:translateY(3px) scale(.985);filter:brightness(1.08)}
  .btn9.green {border-image-source:url("assets/ui/green.png")}
  .btn9.red   {border-image-source:url("assets/ui/red.png")}
  .btn9.blue  {border-image-source:url("assets/ui/blue.png")}
  .btn9.yellow{border-image-source:url("assets/ui/yellow.png");color:#4a2c00;
               text-shadow:0 1px 0 rgba(255,255,255,.45)}
  .btn9.purple{border-image-source:url("assets/ui/purple.png")}
  .btn9.grey  {border-image-source:url("assets/ui/grey.png")}
  .btn9.wide  {border-image-source:url("assets/ui/wide.png");
               border-image-slice:104 150 92 150 fill;border-width:18px 26px 16px 26px}
  .btn9.small {border-image-source:url("assets/ui/small.png");
               border-image-slice:104 104 100 104 fill;border-width:17px 15px 16px 15px}

  /* evolution chain strip */
  #chain{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    display:flex;align-items:center;gap:3px;padding:8px 13px;border-radius:20px;
    background:rgba(255,255,255,.55);border:3px solid rgba(255,255,255,.85);
    box-shadow:0 3px 0 rgba(0,0,0,.14);max-width:94vw;overflow:hidden}
  /* One source of truth for chip size: up to 46px (the +35%), but never wider
     than an eleventh of the strip, so all 11 always fit instead of the tail
     being clipped by overflow:hidden. */
  /* The BOSS badge overhangs the last chip, and the strip is overflow:hidden -
     leave room for it in the chip budget or the badge gets sliced. */
  #chain{--chip:34px;padding-right:20px}   /* JS sets --chip from real space */
  #chain canvas{width:var(--chip);height:var(--chip);display:block}
  #chain .cw{position:relative}
  /* the last few stay blacked out until you actually reach them */
  #chain .cw.lock canvas{filter:brightness(0);opacity:.20}
  #chain .cw.lock::after{content:'?';position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;font-weight:700;font-size:23px;
    color:rgba(255,255,255,.92);text-shadow:0 1px 3px rgba(0,0,0,.7)}
  #chain .cw.reveal canvas{animation:rev .7s cubic-bezier(.2,1.6,.4,1)}
  @keyframes rev{0%{transform:scale(.35) rotate(-30deg)}60%{transform:scale(1.35)}100%{transform:none}}
  #chain .cw.hit canvas{animation:pip .45s}
  @keyframes pip{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}

  /* game over */
  /* ---- coins ---- */
  #purse{position:absolute;left:12px;top:70px;display:flex;align-items:center;gap:6px;
    font:700 16px "Fredoka One",system-ui,sans-serif;color:#5b4a1e;
    background:linear-gradient(#fff3c4,#ffe38a);border:2px solid #e0b73f;
    border-radius:999px;padding:4px 12px 5px;pointer-events:none;
    box-shadow:0 3px 0 rgba(180,140,30,.55)}
  /* The coin is DRAWN, not typed: Fredoka One has no U+25CF, so a literal
     bullet silently fell back to another font wherever it appeared. */
  /* real coin art; U+25CF is not in Fredoka One so a typed bullet fell back */
  .coin{display:inline-block;width:1em;height:1em;vertical-align:-.16em;
    background:url(assets/icon/coin.png) center/contain no-repeat}
  #purse.bump{animation:purseBump .34s ease}
  @keyframes purseBump{40%{transform:scale(1.35)}100%{transform:scale(1)}}

  /* ---- powerups ---- */
  #pups{display:flex;gap:8px;margin-top:8px;justify-content:flex-end}
  /* pointer-events:auto is REQUIRED - #ui is pointer-events:none so the canvas
     can receive drags, and every interactive child must opt back in. Without it
     these buttons were completely dead to clicks. */
  .pup{width:66px;height:58px;flex-direction:column;gap:0;padding-top:9px;
    font:700 12px "Fredoka One",system-ui,sans-serif;cursor:pointer;pointer-events:auto}
  .pup img{width:22px;height:22px;display:block;margin-bottom:-1px;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
  .pup b{font-size:11px;letter-spacing:.3px}
  /* greyed when unaffordable - never hidden, so the price still teaches the economy */
  .pup.broke{filter:grayscale(.9);opacity:.5}
  .pup.armed{outline:3px solid #ffd23f;outline-offset:-3px;animation:armed .7s infinite}
  @keyframes armed{50%{outline-color:#fff}}

  /* ---- collection ---- */
  /* z 9: above pause (7) and worlds (8) - it is opened FROM those, so a lower
     layer left it rendering behind the sheet that launched it. */
  #dex{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    z-index:9;padding:18px 14px}
  #dex.on{display:flex}
  #dexBox{background:#fff;border:5px solid #5b7fa6;border-radius:24px;
    padding:18px 12px 16px;text-align:center;
    width:min(94vw,560px);max-height:86vh;overflow:auto;
    box-shadow:0 12px 0 rgba(0,0,0,.22),0 20px 44px rgba(20,10,40,.5)}
  #dexBox h2{font-size:30px;color:#5b7fa6;letter-spacing:1px}
  #dexSub{font:700 14px "Fredoka One",system-ui,sans-serif;color:#8a7fa8;margin:-4px 0 10px}
  /* 11 cells must fit ONE row - a cast wrapping 9+2 stops reading as the
     evolution chain it mirrors at the bottom of the play screen. */
  .dexRow{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-bottom:10px}
  .dexRow .rowName{width:100%;font:700 12px "Fredoka One",system-ui,sans-serif;
    color:#8a7fa8;letter-spacing:.6px;margin-bottom:2px}
  .dc{width:clamp(26px,6.6vw,44px);height:clamp(26px,6.6vw,44px);border-radius:10px;background:#f0ecf8;
    display:flex;align-items:center;justify-content:center;position:relative}
  .dc img{width:86%;height:86%;display:block;object-fit:contain}
  /* unseen characters render as flat silhouettes - the shape is the tease */
  .dc.locked img{filter:brightness(0) opacity(.20)}
  /* above the silhouette, not behind it */
  .dc.locked:after{content:"?";position:absolute;z-index:1;
    font:700 14px "Fredoka One",system-ui,sans-serif;color:#6f6489;
    text-shadow:0 1px 0 #fff,0 -1px 0 #fff,1px 0 0 #fff,-1px 0 0 #fff}

  /* ---- biome picker ---- */
  #earn{font:700 14px "Fredoka One",system-ui,sans-serif;color:#3aa655;margin:2px 0 0}

  #over{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(20,30,45,.55);pointer-events:auto}
  #over.on{display:flex}
  #overBox{background:#fff;border:5px solid #5b7fa6;border-radius:24px;padding:24px 30px;
    display:flex;flex-direction:column;align-items:center;gap:12px;
    box-shadow:0 10px 0 rgba(0,0,0,.22);min-width:250px}
  #overBox h2{font-size:28px;color:#5b7fa6;letter-spacing:1px}
  #overScore{font-size:52px;font-weight:700;color:#f5a623;
    -webkit-text-stroke:6px #8a5a00;paint-order:stroke fill}
  #overSub{font-size:14px;color:#7b8ea3;font-weight:700}
  .big{font-size:19px;letter-spacing:.5px;min-width:142px;height:66px}
  #overBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  #combo{position:absolute;left:50%;top:88px;transform:translateX(-50%);
    font-size:28px;font-weight:700;color:#ffd85e;letter-spacing:1px;
    -webkit-text-stroke:6px #7a4a00;paint-order:stroke fill;
    opacity:0;transition:opacity .12s,transform .12s;white-space:nowrap}
  #combo.on{opacity:1}
  #combo.pop{transform:translateX(-50%) scale(1.25)}

  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  #banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);
    font-size:46px;font-weight:700;color:#fff;letter-spacing:3px;white-space:nowrap;
    -webkit-text-stroke:8px #23407a;paint-order:stroke fill;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .45s cubic-bezier(.2,1.7,.4,1)}
  #banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

  /* BOSS badge on the final chain slot */
  #chain .cw.boss::before{content:'BOSS';position:absolute;left:50%;top:-9px;
    transform:translateX(-50%);font-size:10px;font-weight:700;letter-spacing:.5px;
    color:#fff;background:#e03a2f;border:2px solid rgba(0,0,0,.45);border-radius:5px;
    padding:0 4px;z-index:2}
  #chain .cw.boss{overflow:visible}

  #toast{position:absolute;left:50%;top:26%;transform:translateX(-50%);
    font-size:30px;font-weight:700;color:#fff;-webkit-text-stroke:6px #d17b00;
    paint-order:stroke fill;opacity:0;transition:opacity .2s;white-space:nowrap}

  @media (max-width:420px){
    #score{font-size:44px;-webkit-text-stroke-width:6px}
    #nextBox{width:64px;height:64px}
    .rnd{width:40px;height:40px}
  }

  /* NO gradient fills on display type. Fredoka One reads as one flat colour
     with a hard outline - a clipped gradient washes the fill out and fights the
     stroke, which is exactly what it looked like. Solid colour + stroke only. */

  /* Button labels stay SOLID white with a thin outline - readable on every face
     colour, and immune to the background-clip problem above. */
  .big, #shake{color:#fff;-webkit-text-stroke:1.3px rgba(28,16,52,.62);
    paint-order:stroke fill;text-shadow:0 2px 1px rgba(20,10,40,.30)}

  /* small Fredoka text: no gradient (it turns to mush at this size) - just a
     crisp outline so it holds up over the busy background */
  #purse{-webkit-text-stroke:.6px rgba(90,60,0,.35);paint-order:stroke fill}
  #dexSub,#earn,.bp,.dexRow .rowName{paint-order:stroke fill}
  .pup b{-webkit-text-stroke:1.2px rgba(30,20,55,.60);paint-order:stroke fill;color:#fff}


  /* floating score numbers - DOM, not canvas: they need real font rendering
     and they sit above the GL layer anyway */
  #pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .pt{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
    font:700 22px "Fredoka One",system-ui,sans-serif;color:#fff;
    -webkit-text-stroke:4px rgba(30,18,60,.55);paint-order:stroke fill;
    animation:ptRise .78s ease-out forwards}
  .pt.gold{color:#ffd23f;-webkit-text-stroke-color:rgba(110,60,0,.6);font-size:27px}
  @keyframes ptRise{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
    22%{opacity:1;transform:translate(-50%,-58%) scale(1.15)}
    60%{opacity:1;transform:translate(-50%,-88%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-130%) scale(.92)}}


  /* A real vignette: flat rgba washes read as grey haze, this darkens toward
     the edges so the sheet in the middle carries the focus. */
  #dex, #pause, #results{
    background:radial-gradient(ellipse at 50% 45%,
      rgba(16,9,32,.68) 0%, rgba(12,6,26,.86) 55%, rgba(8,4,20,.94) 100%)}

  /* ---- pause sheet ---- */
  #pause{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    z-index:7;padding:16px}
  #pause.on{display:flex}
  #pause .sheet{background:#fff;border:5px solid #5b7fa6;border-radius:24px;
    padding:20px 26px;display:flex;flex-direction:column;align-items:center;gap:14px;
    box-shadow:0 10px 0 rgba(0,0,0,.22);min-width:250px}
  #pause .col{display:flex;flex-direction:column;gap:10px;width:100%}
  #pause .col .big{width:100%}

  /* ---- worlds screen ---- */
  #worlds{position:absolute;inset:0;display:none;z-index:8;
    background:linear-gradient(#6f7fb5,#8f9ec9 45%,#b9a184 78%,#9c7f5f);
    overflow:auto;padding:14px 10px 24px}
  #worlds.on{display:block}
  #worlds .scr{max-width:560px;margin:0 auto;position:relative}
  #worlds h2{text-align:center;font-size:44px;letter-spacing:2px;color:#fff;
    -webkit-text-stroke:9px #3d3f6b;paint-order:stroke fill;margin:6px 0 18px}
  #worlds .back{position:absolute;left:0;top:0;pointer-events:auto;z-index:2}
  #worlds .back svg{width:26px;height:26px;fill:#fff}
  #worldGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
  /* one column when there is not enough width for two pills side by side */
  @media (max-width:420px){ #worldGrid{grid-template-columns:1fr} }

  .wpill{position:relative;display:flex;align-items:center;min-height:62px;
    padding:10px 64px 12px 14px;border-radius:999px;cursor:pointer;
    background:linear-gradient(#c07af0,#9b3fd6);
    border:4px solid #fff;box-shadow:0 5px 0 rgba(60,20,90,.45);
    font:700 17px "Fredoka One",system-ui,sans-serif;color:#fff;line-height:1.05;
    -webkit-text-stroke:3px rgba(45,18,70,.7);paint-order:stroke fill;
    pointer-events:auto;transition:transform .1s}
  .wpill:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(60,20,90,.45)}
  .wpill img{position:absolute;right:2px;bottom:2px;width:58px;height:58px;
    object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
  .wpill .cost{display:flex;align-items:center;gap:4px;font-size:14px;
    -webkit-text-stroke:2px rgba(45,18,70,.7)}
  .wpill.locked{background:linear-gradient(#9aa0b8,#6d7490)}
  .wpill.locked img{filter:grayscale(1) brightness(.55)}
  .wpill.sel{background:linear-gradient(#7ee06a,#37a83f);
    box-shadow:0 5px 0 rgba(20,80,25,.5)}
  .wpill .tag{position:absolute;left:10px;top:-9px;background:#e03a2f;color:#fff;
    font-size:10px;letter-spacing:.5px;border:2px solid rgba(0,0,0,.45);
    border-radius:6px;padding:1px 5px;-webkit-text-stroke:0}


  /* ---- death screen: board stays visible ---- */
  #over{position:absolute;inset:0;display:none;flex-direction:column;
    align-items:center;justify-content:space-between;z-index:6;
    background:radial-gradient(ellipse at 50% 55%,rgba(16,9,32,.30) 0%,rgba(10,5,24,.62) 70%,rgba(8,4,20,.78) 100%);padding:18px 14px 26px;pointer-events:auto}
  #over.on{display:flex}
  #overTop{display:flex;flex-direction:column;align-items:center;gap:2px}
  #overScore{font-size:52px;font-weight:700;color:#fff;
    -webkit-text-stroke:8px #2c2350;paint-order:stroke fill}
  #overBest{display:flex;align-items:center;gap:6px;font-size:23px;font-weight:700;
    color:#fff;-webkit-text-stroke:6px #2c2350;paint-order:stroke fill}
  #overBest .crown{color:#ffd23f;-webkit-text-stroke-color:#6a4a00}
  #overTitle{margin-top:6px;font-size:40px;font-weight:700;color:#fff;letter-spacing:1px;
    -webkit-text-stroke:8px #2c2350;paint-order:stroke fill}

  #overMid{display:flex;align-items:center;justify-content:center}
  #btnRevive{position:relative;width:150px;min-height:112px;border-radius:26px;
    background:linear-gradient(#7ee06a,#37a83f);border:5px solid #fff;
    box-shadow:0 6px 0 rgba(20,80,25,.55);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    padding:10px 8px 12px;pointer-events:auto;transition:transform .1s}
  #btnRevive:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(20,80,25,.55)}
  #btnRevive .heart{font-size:30px;color:#ff4d6a;line-height:1;
    text-shadow:0 2px 0 rgba(120,0,25,.5)}
  #btnRevive .lbl{font-size:21px;font-weight:700;color:#fff;
    -webkit-text-stroke:4px rgba(20,70,25,.75);paint-order:stroke fill}
  #btnRevive .sub{font-size:11px;font-weight:700;color:#eaffea;letter-spacing:.6px}
  #btnRevive .ring{position:absolute;top:-12px;right:-12px;min-width:34px;height:34px;
    border-radius:999px;background:#fff;border:4px solid #37a83f;color:#2b7a30;
    font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
  #btnRevive.gone{filter:grayscale(.9);opacity:.5;pointer-events:none}

  #overBot{display:flex;flex-direction:column;align-items:center;gap:8px}
  #btnNoThanks{font-size:19px;font-weight:700;color:#fff;letter-spacing:1px;cursor:pointer;
    -webkit-text-stroke:6px rgba(30,22,60,.75);paint-order:stroke fill;
    padding:6px 18px;pointer-events:auto}

  /* ---- results sheet, shown after the revive offer ---- */
  #results{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    z-index:7;padding:16px}
  #results.on{display:flex}
  #results .sheet{background:#fff;border:5px solid #5b7fa6;border-radius:24px;
    padding:20px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;
    box-shadow:0 10px 0 rgba(0,0,0,.22);min-width:250px}
  #results .col{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:4px}
  #results .col .big{width:100%}
  #resScore{font-size:48px;font-weight:700;color:#f5a623;
    -webkit-text-stroke:6px #8a5a00;paint-order:stroke fill}
  #resSub{font-size:14px;color:#7b8ea3;font-weight:700;margin-top:-6px}
  #resEarn{font:700 15px "Fredoka One",system-ui,sans-serif;color:#3aa655}




  /* ================= JUICE =================
     Transform/opacity only - both composite on the GPU. Animating layout
     properties here would reflow every frame. */

  /* --- jelly press: squash WIDE then rebound past centre, like the buns --- */
  @keyframes jellyPress{
    0%{transform:scale(1,1)}
    30%{transform:scale(1.10,.84) translateY(3px)}
    58%{transform:scale(.95,1.07) translateY(-1px)}
    80%{transform:scale(1.03,.98)}
    100%{transform:scale(1,1)}
  }
  .btn9:active{animation:jellyPress .34s cubic-bezier(.3,1.6,.5,1);
    filter:brightness(1.10)}

  /* --- shine sweep: a highlight travelling across the face on a slow loop.
         Staggered so the buttons do not all flash in unison. --- */
  .btn9{position:relative;overflow:hidden}
  .btn9::after{
    content:'';position:absolute;top:-40%;bottom:-40%;left:-60%;width:38%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-18deg);pointer-events:none;
    animation:sweep 4.5s ease-in-out infinite}
  @keyframes sweep{
    0%,72%{left:-60%}
    88%,100%{left:120%}
  }
  .btn9.green::after{animation-delay:.0s}
  .btn9.blue::after{animation-delay:.9s}
  .btn9.red::after{animation-delay:1.7s}
  .btn9.purple::after{animation-delay:2.4s}
  .btn9.yellow::after{animation-delay:3.1s}
  .btn9.grey::after,.btn9.off::after,.btn9.broke::after{display:none}

  /* --- the primary call to action breathes, so the eye lands on it --- */
  @keyframes breathe{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.045)}
  }
  #btnAgain,#btnRevive{animation:breathe 1.9s ease-in-out infinite}
  #btnRevive{animation-delay:.5s}

  /* --- numbers punch when they change --- */
  @keyframes numPop{
    0%{transform:translateX(-50%) scale(1)}
    35%{transform:translateX(-50%) scale(1.24)}
    100%{transform:translateX(-50%) scale(1)}
  }
  #score.pop{animation:numPop .30s cubic-bezier(.3,1.7,.5,1)}
  @keyframes coinPop{
    0%{transform:scale(1)}
    30%{transform:scale(1.30) rotate(-4deg)}
    100%{transform:scale(1)}
  }
  #purse.bump{animation:coinPop .34s cubic-bezier(.3,1.7,.5,1)}

  /* --- modals spring in rather than appearing --- */
  @keyframes sheetIn{
    0%{transform:scale(.72) translateY(26px);opacity:0}
    62%{transform:scale(1.04) translateY(-4px);opacity:1}
    100%{transform:scale(1) translateY(0);opacity:1}
  }
  #pause.on .sheet,#results.on .sheet,#dex.on #dexBox{
    animation:sheetIn .40s cubic-bezier(.25,1.5,.45,1)}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  #pause.on,#results.on,#dex.on,#worlds.on{animation:fadeIn .18s ease-out}

  /* --- the revive button pulses harder as its timer runs out --- */
  @keyframes urgent{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.07)}
  }
  #btnRevive.hurry{animation:urgent .42s ease-in-out infinite}

  /* --- chain chip celebrates a new tier --- */
  @keyframes chipWin{
    0%{transform:scale(1) rotate(0)}
    25%{transform:scale(1.45) rotate(-9deg)}
    55%{transform:scale(1.15) rotate(6deg)}
    100%{transform:scale(1) rotate(0)}
  }
  #chain .cw.hit canvas{animation:chipWin .52s cubic-bezier(.3,1.6,.5,1)}

  /* --- respect a reduced-motion preference; this is a lot of movement --- */
  @media (prefers-reduced-motion:reduce){
    .btn9::after,#btnAgain,#btnRevive{animation:none}
    #pause.on .sheet,#results.on .sheet,#dex.on #dexBox{animation:none}
  }


  /* ================= JUICE 2: everything else ================= */

  /* --- the coin idles: a slow tilt, so the purse never looks dead --- */
  @keyframes coinIdle{
    0%,100%{transform:rotate(-7deg) scale(1)}
    50%{transform:rotate(7deg) scale(1.06)}
  }
  .coin{animation:coinIdle 2.6s ease-in-out infinite}

  /* --- NEXT preview pops when the upcoming piece changes --- */
  @keyframes nextSwap{
    0%{transform:scale(.55) rotate(-14deg);opacity:0}
    60%{transform:scale(1.14) rotate(5deg);opacity:1}
    100%{transform:scale(1) rotate(0);opacity:1}
  }
  #nextBox canvas.swap{animation:nextSwap .36s cubic-bezier(.3,1.6,.5,1)}
  #nextLbl{animation:breathe 2.8s ease-in-out infinite}

  /* --- toast slides up and overshoots --- */
  @keyframes toastIn{
    0%{transform:translate(-50%,14px) scale(.86);opacity:0}
    55%{transform:translate(-50%,-3px) scale(1.06);opacity:1}
    100%{transform:translate(-50%,0) scale(1);opacity:1}
  }
  #toast{animation:none}
  #toast.show{animation:toastIn .34s cubic-bezier(.3,1.6,.5,1)}

  /* --- combo readout leans into the multiplier --- */
  @keyframes comboKick{
    0%{transform:translateX(-50%) scale(1) rotate(0)}
    30%{transform:translateX(-50%) scale(1.30) rotate(-3deg)}
    60%{transform:translateX(-50%) scale(1.06) rotate(2deg)}
    100%{transform:translateX(-50%) scale(1) rotate(0)}
  }
  #combo.pop{animation:comboKick .34s cubic-bezier(.3,1.7,.5,1)}
  #combo.on{animation:breathe 1.1s ease-in-out infinite}

  /* --- BOSS badge never stops nagging --- */
  @keyframes bossThrob{
    0%,100%{transform:translateX(-50%) scale(1)}
    50%{transform:translateX(-50%) scale(1.16)}
  }
  #chain .cw.boss::before{animation:bossThrob 1.1s ease-in-out infinite}

  /* --- locked chips shimmer faintly, to tease what is still to come --- */
  @keyframes lockTease{
    0%,88%,100%{opacity:.20}
    94%{opacity:.42}
  }
  #chain .cw.lock canvas{animation:lockTease 3.4s ease-in-out infinite}

  /* --- world pills get the same jelly press and a sheen --- */
  .wpill{position:relative;overflow:hidden}
  .wpill:active{animation:jellyPress .34s cubic-bezier(.3,1.6,.5,1)}
  .wpill::after{
    content:'';position:absolute;top:-40%;bottom:-40%;left:-60%;width:36%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
    transform:skewX(-18deg);pointer-events:none;
    animation:sweep 5.2s ease-in-out infinite}
  .wpill.locked::after{display:none}
  .wpill.sel{animation:breathe 2.2s ease-in-out infinite}

  /* --- collection chips cascade in when the sheet opens --- */
  @keyframes chipIn{
    0%{transform:scale(.3) translateY(10px);opacity:0}
    70%{transform:scale(1.10) translateY(-2px);opacity:1}
    100%{transform:scale(1) translateY(0);opacity:1}
  }
  #dex.on .dc{animation:chipIn .34s cubic-bezier(.3,1.6,.5,1) backwards}
  #dex.on .dexRow:nth-child(1) .dc{animation-delay:.02s}
  #dex.on .dexRow:nth-child(2) .dc{animation-delay:.10s}
  #dex.on .dexRow:nth-child(3) .dc{animation-delay:.18s}
  #dex.on .dc:nth-child(2n){animation-duration:.40s}
  .dc:not(.locked):active{animation:jellyPress .3s cubic-bezier(.3,1.6,.5,1)}

  /* --- death screen: the headline drops in, the earnings float up --- */
  @keyframes titleDrop{
    0%{transform:translateY(-30px) scale(.7);opacity:0}
    62%{transform:translateY(5px) scale(1.10);opacity:1}
    100%{transform:translateY(0) scale(1);opacity:1}
  }
  #over.on #overTitle{animation:titleDrop .46s cubic-bezier(.25,1.6,.45,1)}
  #over.on #overScore{animation:titleDrop .46s cubic-bezier(.25,1.6,.45,1) .06s backwards}
  #over.on #overBest{animation:titleDrop .46s cubic-bezier(.25,1.6,.45,1) .12s backwards}
  @keyframes earnFloat{
    0%{transform:translateY(12px);opacity:0}
    100%{transform:translateY(0);opacity:1}
  }
  #earn,#resEarn{animation:earnFloat .40s ease-out backwards;animation-delay:.22s}
  #btnNoThanks:active{animation:jellyPress .3s cubic-bezier(.3,1.6,.5,1)}
  #btnRevive:active{animation:jellyPress .3s cubic-bezier(.3,1.6,.5,1)}

  /* --- results score punches in --- */
  #results.on #resScore{animation:titleDrop .44s cubic-bezier(.25,1.6,.45,1) .08s backwards}

  /* --- shake button jiggles when it is available, to advertise itself --- */
  @keyframes shakeNag{
    0%,86%,100%{transform:rotate(0)}
    90%{transform:rotate(-3deg)}
    94%{transform:rotate(3deg)}
  }
  #shake:not(.off){animation:shakeNag 3.2s ease-in-out infinite}

  /* --- affordable powerups breathe; unaffordable ones sit still --- */
  .pup:not(.broke){animation:breathe 2.4s ease-in-out infinite}
  .pup.armed{animation:urgent .5s ease-in-out infinite}

  @media (prefers-reduced-motion:reduce){
    .coin,#nextLbl,#combo.on,#chain .cw.boss::before,#chain .cw.lock canvas,
    .wpill::after,.wpill.sel,#shake:not(.off),.pup:not(.broke){animation:none}
    #dex.on .dc,#over.on #overTitle,#over.on #overScore,#over.on #overBest{animation:none}
  }

</style>
</head>
<body>
<div id="bg"></div>
<div id="floor"></div>
<img id="box" src="assets/biome/box_meadow.png" alt="">
<canvas id="gl"></canvas>
<!-- AFTER the canvas: the scenery is foreground, so characters pass behind it.
     .props is pointer-events:none, so it never eats a drag. -->
<div id="propsL" class="props"></div>
<div id="propsR" class="props"></div>

<div id="ui">
  <div id="tl">
    <div class="rnd btn9 small" id="btnPause"><img src="assets/icon/pause.png" alt="pause"></div>
    <!-- no in-game mute: cert forbids duplicating a platform action, and
         audio must follow YouTube's own setting instead -->
  </div>

  <div id="purse"><span class="coin"></span><span id="coinN">0</span></div>

  <div id="score">0</div>

  <div id="tr">
    <div id="nextBox" class="btn9 grey"></div>
    <div id="nextLbl">NEXT</div>
    <div id="shake" class="btn9 wide green">
      <img src="assets/icon/shake.png" alt="">
      SHAKE
    </div>
    <div id="pups">
      <div class="pup btn9 blue" id="btnSwap">
        <img src="assets/icon/swap.png" alt="">
        <b id="costSwap">60</b>
      </div>
      <div class="pup btn9 red" id="btnHammer">
        <img src="assets/icon/hammer.png" alt="">
        <b id="costHam">150</b>
      </div>
    </div>
  </div>

  <div id="chain"></div>
  <div id="flash"></div>
  <div id="banner"></div>
  <div id="combo"></div>
  <div id="toast"></div>
  <div id="pops"></div>
</div>

<div id="over">
  <!-- Deliberately NOT a solid card: the board stays visible behind, so the
       player sees exactly how they lost while deciding whether to revive. -->
  <div id="overTop">
    <div id="overScore">0</div>
    <div id="overBest"><span class="crown">&#9819;</span><span id="overBestN">0</span></div>
    <div id="overTitle">OH NO!</div>
  </div>
  <div id="overMid">
    <div id="btnRevive">
      <div class="heart">&#10084;</div>
      <div class="lbl">REVIVE</div>
      <div class="sub" id="reviveSub">WATCH AD</div>
      <div class="ring" id="reviveRing">15</div>
    </div>
  </div>
  <div id="overBot">
    <div id="earn"></div>
    <div id="btnNoThanks">NO THANKS</div>
  </div>
</div>

<div id="results">
  <div class="sheet">
    <h2>RUN OVER</h2>
    <div id="resScore">0</div>
    <div id="resSub">best 0</div>
    <div id="resEarn"></div>
    <div class="col">
      <div class="big btn9 green" id="btnAgain">PLAY AGAIN</div>
      <div class="big btn9 purple" id="btnWorlds2">WORLDS</div>
      <div class="big btn9 blue" id="btnDex">COLLECTION</div>
    </div>
  </div>
</div>

<div id="pause">
  <div class="sheet">
    <h2>PAUSED</h2>
    <div class="col">
      <div class="big btn9 green" id="btnResume">RESUME</div>
      <div class="big btn9 purple" id="btnWorlds">WORLDS</div>
      <div class="big btn9 blue" id="btnDex2">COLLECTION</div>
      <div class="big btn9 red" id="btnRestart">RESTART</div>
    </div>
  </div>
</div>

<div id="worlds">
  <div class="scr">
    <div class="rnd btn9 small back" id="btnWorldsBack">
      <svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7z"/></svg>
    </div>
    <h2>WORLDS</h2>
    <div id="worldGrid"></div>
  </div>
</div>

<div id="dex">
  <div id="dexBox">
    <h2>COLLECTION</h2>
    <div id="dexSub">0 / 33</div>
    <div id="dexRows"></div>
    <div class="big btn9 green" id="btnDexClose">BACK</div>
  </div>
</div>

<script src="src/gfx.js?v=3d1"></script>
<script src="src/merge.js?v=3d1"></script>
<script src="src/ui.js?v=3d1"></script>
<script src="src/main.js?v=3d1"></script>
</body>
</html>
